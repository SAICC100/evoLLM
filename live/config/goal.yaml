name: "西方幻想世界模拟"
description: |
  一个西方奇幻风格的世界模拟。世界地图随机生成，包含多种地形（森林、山脉、平原、河流、荒野）。
  初始状态：3 个部落，每个部落 100 人，分布在地图不同区域。

  部落有自己的文化、领地、资源。NPC 有姓名、年龄、性别、职业、健康、体力、金钱、所属部落。
  世界随时间演进：NPC 出生、死亡、结婚、迁移；部落扩张、冲突、联盟；季节变化影响食物和生存。

  核心实体：
  - World: 地图（地形格子）、当前 tick、季节
  - Tribe: 部落（名称、领地、人口、资源、外交关系）
  - NPC: 个体（姓名、年龄、性别、职业、健康、体力、金钱、部落归属、位置）
  - Event: 事件（类型、描述、参与者、影响）

version: "1.0"

metrics:
  - id: population_vitality
    description: "人口有自然流动，每 30 tick 内应有出生和死亡"
    query: "SELECT COUNT(*) FROM events WHERE type IN ('death', 'birth') AND tick > {current_tick} - 30"
    threshold: "> 5"
    weight: 0.25

  - id: event_diversity
    description: "事件类型多样，每 10 tick 应出现 5 种以上不同类型事件"
    query: "SELECT COUNT(DISTINCT type) FROM events WHERE tick > {current_tick} - 10"
    threshold: "> 5"
    weight: 0.25

  - id: tribe_dynamics
    description: "部落之间有互动，每 20 tick 内应有部落间事件"
    query: "SELECT COUNT(*) FROM events WHERE type IN ('conflict', 'trade', 'diplomacy', 'raid', 'alliance') AND tick > {current_tick} - 20"
    threshold: "> 2"
    weight: 0.25

  - id: npc_activity
    description: "每 tick 都有 NPC 行动记录"
    query: "SELECT COUNT(DISTINCT npc_id) FROM events WHERE tick = {current_tick}"
    threshold: "> 10"
    weight: 0.25

scoring: weighted_average
target_score: 0.8

# 世界初始参数（Bootstrapper 读取用于生成世界）
world_config:
  map_width: 32
  map_height: 32
  terrain_types:
    - plains      # 平原：食物+，适合农耕
    - forest      # 森林：木材+，适合狩猎
    - mountain    # 山脉：矿石+，移动-
    - river       # 河流：淡水+，渔业+，天然屏障
    - wasteland   # 荒野：资源稀少，危险+

  tribes:
    - name: "铁爪部落"
      culture: "战士文化，崇尚力量，擅长战斗和狩猎"
      preferred_terrain: forest
      population: 100
    - name: "银月部落"
      culture: "智者文化，崇尚魔法和知识，擅长农耕和贸易"
      preferred_terrain: plains
      population: 100
    - name: "石心部落"
      culture: "工匠文化，崇尚技艺，擅长采矿和建造"
      preferred_terrain: mountain
      population: 100

  seasons:
    - name: spring
      duration: 30
      food_modifier: 1.2
      event_flavor: "万物复苏，适合迁徙和探索"
    - name: summer
      duration: 40
      food_modifier: 1.5
      event_flavor: "食物充足，部落扩张和冲突多发"
    - name: autumn
      duration: 30
      food_modifier: 1.3
      event_flavor: "收获季节，贸易活跃"
    - name: winter
      duration: 30
      food_modifier: 0.5
      event_flavor: "严冬考验，老弱易死，部落内聚"
